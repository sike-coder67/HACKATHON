<html>
<title>EcoWork - Register</title>
<body style="background-color: cornsilk; color: black; border: 0.5cm; border-color: maroon; border-style: solid; padding: 20px; margin: 20px;">
 <h2>Register for EcoWork</h2>
<p>Who are you registering as?</p>
<button type="button" onclick="showForm('individual')" " style="background-color: cyan; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: grab;">Individual</button> 
<button type="button" onclick="showForm('institution')" " style="background-color: cyan; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: grab;">Institution</button>
<form id="regForm" style="display:none;">
<br>
<label>Name:</label>
<input type="text" id="name" required><br><br>
<label>Phone Number:</label>
<input type="tel" required><br><br>
<label>City / Area:</label>
<input type="text" required><br><br>
<div id="institutionField" style="display:none;">
<label>Institution Name:</label>
<input type="text" id="institutionName">
</div>
<br>
<button type="submit" " style="background-color: cyan; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: grab;">Register</button>
</form>
<script>
function showForm(type) {
document.getElementById("regForm").style.display = "block";
let field = document.getElementById("institutionField");
let input = document.getElementById("institutionName");
field.style.display = type === "institution" ? "block" : "none";
input.required = type === "institution";}
</script>

</body>
</html>
